<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ILYOS">
  <title>ILYOS</title>
  <!-- Couronne d'or sur ciel de nuit : les deux signes du jeu. Les formes sont
       volontairement épaisses, sans détail fin — l'icône doit rester lisible à
       16 px dans un onglet, où tout ce qui mesure moins de 8 px disparaît. -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4257"/>
      <stop offset="1" stop-color="#0a1722"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3b4"/>
      <stop offset="0.5" stop-color="#e8c98a"/>
      <stop offset="1" stop-color="#c9a45d"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ciel)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none"
        stroke="#c9a45d" stroke-opacity=".45" stroke-width="12"/>

  <!-- Le halo du sanctuaire, sous la couronne. -->
  <ellipse cx="256" cy="368" rx="150" ry="30" fill="#e8c98a" opacity=".14"/>

  <!-- La couronne : trois pointes, un bandeau, trois gemmes. -->
  <path fill="url(#or)"
        d="M104 320 L84 168 L166 226 L256 124 L346 226 L428 168 L408 320 Z"/>
  <rect x="104" y="332" width="304" height="56" rx="16" fill="url(#or)"/>

  <circle cx="256" cy="360" r="19" fill="#0a1722" opacity=".55"/>
  <circle cx="164" cy="360" r="13" fill="#0a1722" opacity=".4"/>
  <circle cx="348" cy="360" r="13" fill="#0a1722" opacity=".4"/>

  <circle cx="256" cy="124" r="26" fill="#f6e3b4"/>
  <circle cx="84" cy="168" r="19" fill="#f6e3b4"/>
  <circle cx="428" cy="168" r="19" fill="#f6e3b4"/>
</svg>
