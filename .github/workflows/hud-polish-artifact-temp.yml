name: HUD polish artifact temp

on:
  push:
    branches: [hud-polish-targeted-v1]
    paths:
      - '.github/workflows/hud-polish-artifact-temp.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ilyos-hud-polish-captures
          path: validation/hud-polish/*.png
          if-no-files-found: error
          retention-days: 1
