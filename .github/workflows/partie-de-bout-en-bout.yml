# Le harnais de test du jeu existait déjà — `window.ILYOS_TEST`, le mode IA
# contre IA, `ILYOS_API.launchConfiguredGame()` — mais rien ne l'exécutait :
# une régression qui casse une partie ne se voyait qu'en jouant, donc tard.
#
# Ce workflow joue une partie entière dans un vrai navigateur et échoue sur la
# moindre exception, le moindre `console.error` ou la moindre ressource
# manquante. Il complète « Intégrité du build », qui vérifie le fichier servi
# mais ne l'exécute jamais.
#
# Déclenchement : sur `main` et à la demande — PLUS sur les pull requests.
#
# Pourquoi il a été retiré des PR : il n'échouait pas sur une régression, il
# expirait. Le garde-fou interne du test — 90 s sans changement de tour — ne
# s'est jamais déclenché, ce qui prouve que la partie AVANÇAIT ; elle n'avait
# simplement pas fini au bout des 15 minutes du délai Playwright (15,5 min
# mesurées sur le dernier échec).
#
# La cause est le coût de la décision Expert, passé d'environ 1,4 s à 5 s avec
# l'évaluateur V1 et l'anticipation adverse — un choix assumé, « je préfère
# 5 secondes pour une bonne décision ». Multiplié par 80 tours et par des
# runners plus lents qu'une machine de bureau, le budget ne tient plus. C'est
# le budget du test qui est devenu trop petit, pas le jeu qui est cassé.
#
# Un échec permanent sur chaque PR ne signale plus rien : il apprend seulement
# à ignorer le rouge. On le sort donc des PR plutôt que de le laisser mentir.
# « Intégrité du build » reste, lui, sur chaque PR.
name: Partie de bout en bout

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  partie:
    name: une partie IA contre IA va jusqu'à la victoire
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer l'outillage de test
        run: npm ci

      # --with-deps ajoute les bibliothèques système dont Chromium a besoin sur
      # un runner nu ; sans elles le navigateur ne démarre tout simplement pas.
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Jouer la partie
        run: npx playwright test

      # En cas d'échec, la trace Playwright rejoue la partie pas à pas, avec le
      # DOM, la console et le réseau de chaque instant — nettement plus utile
      # qu'une ligne d'erreur pour comprendre où la partie a déraillé.
      - name: Conserver la trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trace-playwright
          path: test-results/
          retention-days: 7
