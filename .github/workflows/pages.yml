# Mise en ligne de taekun.fr (GitHub Pages) à chaque fusion dans main.
#
# Le site reste le dépôt tel quel, à une ligne près : la version de js/game.js
# dans index.html est remplacée par l'empreinte du bundle publié
# (scripts/estampiller.js). Plus personne n'écrit ce `?v=` à la main, donc les
# PR n'entrent plus en conflit sur cette ligne.
#
# Réglage requis une fois dans le dépôt : Settings > Pages > Source =
# « GitHub Actions » (au lieu de « Deploy from a branch »).
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    name: publier le site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Le bundle correspond à ses fragments
        run: node scripts/build-game.js
      - name: Version de game.js = empreinte du bundle
        run: node scripts/estampiller.js
      - name: Retirer ce qui n'est pas le site
        run: rm -rf .git .github node_modules tests scripts docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
