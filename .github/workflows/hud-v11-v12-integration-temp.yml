name: HUD V11 + Cards V12 integration temp

on:
  push:
    branches: [hud-card-piles-discard-v11]
  pull_request:
    branches: [hud-card-piles-discard-v11]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          sleep 2
          mkdir -p validation/hud-v11-v12
          cat > integration.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2400);
          await page.evaluate(()=>document.getElementById('gameScreen')?.classList.remove('hidden'));
          await page.waitForTimeout(300);
          const play=page.locator('button:visible',{hasText:'JOUER'}).first();
          if(await play.count()) { await play.click({timeout:10000}).catch(()=>{}); await page.waitForTimeout(3800); }
          await page.waitForSelector('#ov2DiscardHud',{state:'attached',timeout:15000});
          await page.evaluate(()=>{
            const snapshot={currentPlayer:0,players:[{name:'JOUEUR AZUR',discard:[
              {id:'d1',action:'MOVE'},{id:'d2',action:'MOVE'},{id:'d3',action:'MOVE'},
              {id:'p1',action:'PUSH'},{id:'p2',action:'PUSH'},{id:'m1',action:'MAGIC'}
            ]}]};
            localStorage.setItem('ilyos-local-session-v22',JSON.stringify(snapshot));
            const ds=document.getElementById('hudV2HandPopoverDiscard')||document.getElementById('discardCount'); if(ds) ds.textContent='6';
            const ps=document.getElementById('hudV2HandPopoverDeck')||document.getElementById('deckCount'); if(ps) ps.textContent='7';
            window.ILYOS_DECK_DISCARD_HUD?.sync?.();
            window.ILYOS_DISCARD_VIEWER?.open?.();
            const icons={MOVE:'<svg viewBox="0 0 48 48"><g fill="currentColor"><ellipse cx="17" cy="14" rx="5" ry="8"/><ellipse cx="31" cy="32" rx="5" ry="8"/></g></svg>',PUSH:'<svg viewBox="0 0 48 48"><path d="M7 24h24M23 14l10 10-10 10" fill="none" stroke="currentColor" stroke-width="4"/></svg>',MAGIC:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>'};
            const sample=document.createElement('div'); sample.id='v12IntegrationSample'; sample.style.cssText='position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;gap:18px;z-index:1005000;pointer-events:none';
            for(const type of ['MOVE','PUSH','MAGIC']){const el=document.createElement('div');el.className=`card-cycle-v7-card card-cycle-v10-card showcase type-${type.toLowerCase()}`;el.style.cssText='position:relative!important;left:auto!important;top:auto!important;width:88px!important;height:138px!important';el.innerHTML=`<span class="card-cycle-v7-kicker">CARTE ACTION</span><span class="card-cycle-v7-icon">${icons[type]}</span><b>${type==='MOVE'?'DÉPLACER':type==='PUSH'?'POUSSER':'MAGIE'}</b><i class="card-cycle-v7-rune"></i><span class="card-cycle-v10-source">TIRÉE DE LA PIOCHE</span>`;sample.appendChild(el)}
            document.body.appendChild(sample);
          });
          await page.waitForTimeout(350);
          const check=await page.evaluate(()=>{
            const hrefs=[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.href);
            const viewer=document.getElementById('ov2DiscardViewer');
            const counts=[...viewer.querySelectorAll('.ov2-discard-type-count')].map(x=>x.textContent);
            const face=document.querySelector('#v12IntegrationSample .type-push');
            const icon=face.querySelector('.card-cycle-v7-icon');
            const fr=face.getBoundingClientRect(), ir=icon.getBoundingClientRect();
            return {
              cardArt:hrefs.some(x=>x.includes('card-art-v12.css')),
              tuning:hrefs.some(x=>x.includes('card-art-v12-tuning.css')),
              discardOpen:viewer.classList.contains('ov2-discard-viewer-open'),
              discardCards:viewer.querySelectorAll('.ov2-discard-type-card').length,
              counts,
              kicker:getComputedStyle(face.querySelector('.card-cycle-v7-kicker')).display,
              source:getComputedStyle(face.querySelector('.card-cycle-v10-source')).display,
              iconRatio:ir.width/fr.width,
              labelSize:parseFloat(getComputedStyle(face.querySelector(':scope > b')).fontSize),
              deckCount:document.querySelector('#ov2DeckHud .ov2-pile-count')?.textContent,
              discardCount:document.querySelector('#ov2DiscardHud .ov2-pile-count')?.textContent
            };
          });
          console.log('INTEGRATION_CHECK',check);
          if(!check.cardArt||!check.tuning||!check.discardOpen||check.discardCards!==3||check.counts.join(',')!=='×3,×2,×1'||check.kicker!=='none'||check.source!=='none'||check.iconRatio<.72||check.labelSize<11) throw new Error('Validation intégrée échouée');
          await page.screenshot({path:'validation/hud-v11-v12/hud-v11-v12-integrated.png'});
          await browser.close();
          NODE
          node integration.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ilyos-hud-v11-v12-integration
          path: validation/hud-v11-v12/*.png
          retention-days: 1