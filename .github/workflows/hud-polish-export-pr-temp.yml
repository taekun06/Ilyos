name: HUD polish export PR temp

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

jobs:
  export:
    if: github.head_ref == 'hud-polish-targeted-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: ilyos-hud-polish-captures
          path: validation/hud-polish/*.png
          if-no-files-found: error
          retention-days: 1
