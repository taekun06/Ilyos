name: Rebuild game bundle

on:
  push:
    branches:
      - feat/tutorial-discovery-flow

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tutorial-discovery-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild generated bundle
        run: node scripts/build-game.js --write
      - name: Commit generated bundle when needed
        run: |
          if git diff --quiet -- js/game.js; then
            echo "Bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/game.js
          git commit -m "build: regenerate game bundle"
          git push origin HEAD:feat/tutorial-discovery-flow
