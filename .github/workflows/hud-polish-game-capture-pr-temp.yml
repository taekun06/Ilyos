name: HUD polish game capture PR temp

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

jobs:
  capture-game:
    if: github.head_ref == 'hud-polish-targeted-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          sleep 2
          mkdir -p validation/hud-polish-game
          cat > capture-game-temp.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2200);

          // Le configurateur appartient au conteneur de jeu, masqué au chargement.
          await page.evaluate(()=>document.getElementById('gameScreen')?.classList.remove('hidden'));
          await page.waitForTimeout(350);
          const play=page.locator('button:visible',{hasText:'JOUER'}).first();
          if(!(await play.count())) throw new Error('Bouton JOUER visible introuvable');
          await play.click({timeout:10000});
          await page.waitForTimeout(4500);
          await page.waitForSelector('#ilyosHudOrganicV2',{state:'visible',timeout:15000});
          await page.waitForSelector('#gameScreen:not(.hidden)',{state:'visible',timeout:15000});

          // Stoppe uniquement l'observer du polish pour illustrer les deux états actifs.
          await page.evaluate(()=>window.ILYOS_HUD_POLISH_TARGETED?.stop?.());

          async function setVisualState(side){
            await page.evaluate((side)=>{
              const left=document.querySelector('#ilyosHudOrganicV2 .ov2-side.ov2-left');
              const right=document.querySelector('#ilyosHudOrganicV2 .ov2-side.ov2-right');
              left?.classList.toggle('is-active',side==='left');
              right?.classList.toggle('is-active',side==='right');
              left?.classList.remove('turn-boost'); right?.classList.remove('turn-boost');
              const lt=document.getElementById('ov2LeftActive'),rt=document.getElementById('ov2RightActive');
              lt?.classList.toggle('ov2-off',side!=='left');
              rt?.classList.toggle('ov2-off',side!=='right');
              if(lt) lt.textContent='À VOUS'; if(rt) rt.textContent='À VOUS';
              const move=document.getElementById('ov2MoveCount'),push=document.getElementById('ov2PushCount'),magic=document.getElementById('ov2MagicCount');
              if(move) move.textContent='×8'; if(push) push.textContent='×4'; if(magic) magic.textContent='×1';
              document.querySelectorAll('#ilyosHudOrganicV2 .ov2-action').forEach(x=>x.classList.remove('ov2-selected'));
              document.getElementById('ov2Push')?.classList.add('ov2-selected');
              const undo=document.getElementById('ov2Undo'); if(undo) undo.disabled=false;
              const deck=document.getElementById('ov2DeckHud'),discard=document.getElementById('ov2DiscardHud');
              if(deck?.querySelector('.ov2-pile-count')) deck.querySelector('.ov2-pile-count').textContent='8';
              if(discard?.querySelector('.ov2-pile-count')) discard.querySelector('.ov2-pile-count').textContent='5';
            },side);
            await page.waitForTimeout(220);
          }

          await setVisualState('left');
          await page.screenshot({path:'validation/hud-polish-game/hud-normal.png'});
          await setVisualState('right');
          await page.screenshot({path:'validation/hud-polish-game/hud-right-active.png'});
          await browser.close();
          NODE
          node capture-game-temp.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ilyos-hud-polish-game-captures
          path: validation/hud-polish-game/*.png
          if-no-files-found: error
          retention-days: 1
